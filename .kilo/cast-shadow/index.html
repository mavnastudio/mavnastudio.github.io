<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opening Cast - Shadow Brain Puzzle...</title>
    
    <!-- Fallback meta refresh -->
    <meta http-equiv="refresh" content="2; url=https://play.google.com/store/apps/details?id=com.mavnastudio.castshadow">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #0284c7, #38bdf8);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
        }

        .app-icon svg {
            width: 36px;
            height: 36px;
            stroke: #ffffff;
            stroke-width: 2.2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .spinner-wrapper {
            margin-bottom: 32px;
            display: flex;
            justify-content: center;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--primary);
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 14px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.7;
        }
    </style>

    <script type="text/javascript">
        const TARGET_URL = "https://play.google.com/store/apps/details?id=com.mavnastudio.castshadow";

        // Smooth redirect after a brief delay
        setTimeout(() => {
            window.location.href = TARGET_URL;
        }, 1500);
    </script>
</head>
<body>

    <div class="container">
        <!-- Logo / Icon -->
        <div class="app-icon">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1>Opening TodoPool</h1>
        <p>Redirecting you to Google Play.<br>This will only take a moment.</p>

        <!-- Loading Spinner -->
        <div class="spinner-wrapper">
            <div class="spinner"></div>
        </div>

        <!-- Manual Action Button -->
        <a id="redirect-btn" href="https://play.google.com/store/apps/details?id=com.mavnastudio.castshadow" class="btn">
            Open in Google Play
        </a>

        <div class="footer">
            Tap the button if you are not redirected automatically
        </div>
    </div>

    <script>
        // Sync button target with JS target URL
        document.getElementById('redirect-btn').href = TARGET_URL;
    </script>
</body>
</html>
