<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast — Shadow Brain Puzzle | Google Play</title>
    
    <!-- Fallback meta refresh -->
    <meta http-equiv="refresh" content="2; url=https://play.google.com/store/apps/details?id=com.mavnastudio.castshadow">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-icon {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #1e3a8a, #0284c7 60%, #38bdf8);
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px -5px rgba(56, 189, 248, 0.35);
        }

        .app-icon svg {
            width: 40px;
            height: 40px;
            stroke: #ffffff;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }

        .sub-name {
            font-size: 14px;
            color: var(--primary);
            font-weight: 500;
            margin-bottom: 12px;
        }

        p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .spinner-wrapper {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background-color: var(--primary);
            color: #0f172a;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 14px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .btn:hover {
            background-color: var(--primary-hover);
            color: #ffffff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .footer {
            margin-top: 22px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.75;
        }
    </style>

    <script type="text/javascript">
        const TARGET_URL = "https://play.google.com/store/apps/details?id=com.mavnastudio.castshadow";

        // Smooth redirect after brief delay without polluting history stack
        setTimeout(() => {
            window.location.replace(TARGET_URL);
        }, 1200);
    </script>
</head>
<body>

    <div class="container">
        <!-- 3D Shadow Cube Icon -->
        <div class="app-icon">
            <svg viewBox="0 0 24 24">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
        </div>

        <h1>Opening Cast</h1>
        <div class="sub-name">Düş — Gölge ve Zeka Oyunu</div>
        <p>Redirecting you to Google Play.<br>This will only take a moment.</p>

        <!-- Loading Spinner -->
        <div class="spinner-wrapper">
            <div class="spinner"></div>
        </div>

        <!-- Manual Action Button -->
        <a id="redirect-btn" href="https://play.google.com/store/apps/details?id=com.mavnastudio.castshadow" class="btn">
            <svg viewBox="0 0 24 24">
                <path d="M3.609 1.814L13.792 12 3.61 22.186a2.03 2.03 0 0 1-.22-.924V2.738c0-.34.08-.654.22-.924zm11.602 11.604L6.963 21.666l10.155-5.864-1.907-2.384zm0-2.836l1.907-2.384L6.963 2.334l8.248 8.248zM18.17 11.23l2.84 1.64c.732.423.732 1.117 0 1.54l-2.84 1.64-2.146-2.41 2.146-2.41z"/>
            </svg>
            Open in Google Play
        </a>

        <div class="footer">
            Tap the button if you are not redirected automatically
        </div>
    </div>

    <script>
        // Sync button target with JS target URL
        document.getElementById('redirect-btn').href = TARGET_URL;
    </script>
</body>
</html>
