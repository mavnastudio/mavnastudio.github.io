<script>
/* Kampanya bilgisini Play'e taşır.
   Bio bağlantısı örnekleri:
     /cast-shadow/?s=instagram
     /cast-shadow/?utm_source=tiktok&utm_medium=organic&utm_campaign=tur1
   Parametre yoksa çıplak mağaza adresine gider (organik). */
(function () {
  var BASE = "https://play.google.com/store/apps/details?id=com.mavnastudio.castshadow";
  var q = new URLSearchParams(location.search);
  var src = q.get("utm_source") || q.get("s");
  var target = BASE;
  if (src) {
    var parts = [
      "utm_source=" + src,
      "utm_medium=" + (q.get("utm_medium") || "organic"),
      "utm_campaign=" + (q.get("utm_campaign") || "tur1")
    ];
    if (q.get("utm_content")) parts.push("utm_content=" + q.get("utm_content"));
    if (q.get("utm_term"))    parts.push("utm_term=" + q.get("utm_term"));
    target = BASE + "&referrer=" + encodeURIComponent(parts.join("&"));
  }
  window.__CAST_TARGET = target;
  location.replace(target);          /* gecikme yok */
})();
</script>
